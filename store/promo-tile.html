<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Promo Tile</title>
  <!-- Chrome Web Store small promo tile, 440x280. Captured by scripts/make_screenshots.sh. -->
  <style>
    html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
    body { background: #185FA5; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; justify-content: center; padding: 0 36px; box-sizing: border-box; }
    .top { display: flex; align-items: center; gap: 14px; }
    img { width: 58px; height: 58px; border-radius: 13px; box-shadow: 0 0 0 2px rgba(255,255,255,.35); }
    h1 { font-size: 34px; margin: 0; letter-spacing: -0.02em; }
    p { font-size: 18px; line-height: 1.35; margin: 16px 0 0; color: #E6F1FB; }
    .tags { margin-top: 14px; font-size: 13px; font-weight: 600; color: #fff; opacity: .9; }
  </style>
</head>
<body>
  <div class="top"><img src="icon-512.png" alt=""><h1>Scam Detector</h1></div>
  <p>A clear warning above scam emails in Gmail and Outlook.</p>
  <div class="tags">School project · Open source · Checked on your device</div>
</body>
</html>
